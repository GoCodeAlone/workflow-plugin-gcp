version: 2
project_name: workflow-plugin-gcp

before:
  hooks:
    - go mod tidy
    - "sh -c \"cp plugin.json cmd/workflow-plugin-gcp/plugin.json\""
    - bash scripts/update-plugin-version.sh {{ .Version }}

builds:
  - id: plugin
    main: ./cmd/workflow-plugin-gcp
    binary: workflow-plugin-gcp
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/GoCodeAlone/workflow-plugin-gcp/provider.Version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: .release/plugin.json
        dst: plugin.json
      - plugin.contracts.json
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  draft: true
  github:
    owner: GoCodeAlone
    name: workflow-plugin-gcp

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
